<!DOCTYPE html>
<html>
<head>
<title>Maze System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bureau">
    <!-- Icônes du bureau -->
    <div class="icone" onclick="ouvrirDAX()">
        <img src="images/dossier.png">
        <p>DAX</p>
    </div>

    <div class="icone" onclick="ouvrirDossierArchive()">
        <img src="images/dossier.png">
        <p>Archive</p>
    </div>

    <div class="icone" onclick="ouvrirCorbeille()">
        <img src="images/corbeille.png">
        <p>Corbeille</p>
    </div>

    <!-- Service #### (à la droite totale de l'écran) -->
    <div class="icone service" onclick="ouvrirService()">
        <img src="images/telephone.png">
        <p>Service ####</p>
    </div>
</div>

<!-- Fenêtre de demande de code -->
<div id="fenetreCode" class="fenetreCode" style="display: none;">
    <div class="barre">
        <div class="titreBarre">
            <button class="btnRetour" onclick="fermerCode()" title="Retour">←</button>
            <span>Dossier sécurisé</span>
        </div>
        <div class="boutonsFenetre">
            <button onclick="reduireCode()">—</button>
            <button onclick="fermerCode()">✕</button>
        </div>
    </div>
    <div id="contenuCode" class="contenu">
        <p class="texteCode">Entrez le code :</p>
        <div class="ligneInput">
            <input id="code" type="text" placeholder="...">
            <button onclick="verifierCode()">Ouvrir</button>
        </div>
        <p id="message" class="messageErreur"></p>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
